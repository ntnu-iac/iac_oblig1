name: Riv ned et miljø

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Miljø som skal rives ned
        type: choice
        options: [dev, test, prod]
        required: true
      bekreftelse:
        description: 'Skriv "riv ned <miljø>" for å bekrefte'
        type: string
        required: true
      begrunnelse:
        description: Hvorfor river du ned?
        type: string
        required: true

concurrency:
  group: webapp-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  bekreft:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk bekreftelsen
        env:
          BEKREFTELSE: ${{ inputs.bekreftelse }}
          MILJO: ${{ inputs.environment }}
        run: |
          if [ "$BEKREFTELSE" != "riv ned $MILJO" ]; then
            echo "::error::Ikke bekreftet. Forventet: riv ned $MILJO"
            exit 1
          fi
          echo "Bekreftet."

  riv-ned-compute:
    needs: bekreft
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: stacks/compute

    env:
      MILJO: ${{ inputs.environment }}
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila for miljøet
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-${{ env.MILJO }}" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/shared/backend.tfbackend" \
            -backend-config="key=env/${{ env.MILJO }}/compute.tfstate"

      - name: Lag en destroy-plan
        run: terraform plan -destroy -out=tfdestroy

      - name: Utfør destroy-planen
        run: terraform apply tfdestroy

      - name: Verifiser at det er tomt
        run: terraform state list

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars

  riv-ned-network:
    needs: riv-ned-compute
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: stacks/network

    env:
      MILJO: ${{ inputs.environment }}
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila for miljøet
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-${{ env.MILJO }}" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/shared/backend.tfbackend" \
            -backend-config="key=env/${{ env.MILJO }}/network.tfstate"

      - name: Lag en destroy-plan
        run: terraform plan -destroy -out=tfdestroy

      - name: Utfør destroy-planen
        run: terraform apply tfdestroy

      - name: Verifiser at det er tomt
        run: terraform state list

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars
